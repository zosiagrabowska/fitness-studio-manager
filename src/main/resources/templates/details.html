<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Class details</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 40px;
    }
    h1 { margin-bottom: 20px; text-align: center; }
    .info { margin-bottom: 20px; width: 80%; max-width: 900px; }
    .info p { margin: 4px 0; }
    table {
      border-collapse: collapse;
      width: 80%;
      max-width: 900px;
      margin-bottom: 12px;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: center;
    }
    th { background-color: #f4f4f4; }
    .action-buttons a {
      display: inline-block;
      padding: 4px 8px;
      font-size: 0.8rem;
      margin: 0 2px;
      border-radius: 4px;
      text-decoration: none;
      color: white;
    }
    .action-buttons .delete { background-color: #f44336; }
    .action-buttons .delete:hover { background-color: #d32f2f; cursor: pointer; }
    .top-buttons {
      display: flex;
      flex-direction: row;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
      width: 80%;
      max-width: 900px;
    }
    .top-buttons button, .top-buttons a {
      width: 150px;
      padding: 8px 12px;
      font-size: 0.9rem;
      border-radius: 6px;
      text-decoration: none;
      border: none;
      cursor: pointer;
      color: white;
    }
    .top-buttons button.delete-selected {
      background-color: #f44336;
    }
    .top-buttons button.delete-selected:hover { background-color: #d32f2f; }
    .top-buttons a.back {
      background-color: #1e4d93;
    }
    .top-buttons a.back:hover { background-color: #163a6e; }

    .top-buttons button.export-csv {
      background-color: #828282;
    }
    .top-buttons button.export-csv:hover {
      background-color: #6e6e6e;
    }
  </style>
</head>
<body>

<h1 th:text="${event.title}">Class title</h1>

<div class="info">
  <p><strong>Room:</strong> <span th:text="${event.location}"></span></p>
  <p><strong>Date:</strong> <span th:text="${#temporals.format(event.startTime, 'dd.MM.yyyy')}"></span></p>
  <p><strong>Time:</strong>
    <span th:text="${#temporals.format(event.startTime, 'HH:mm')}"></span> -
    <span th:text="${#temporals.format(event.endTime, 'HH:mm')}"></span>
  </p>
  <p><strong>Participants:</strong> <span th:text="${event.registered + ' / ' + event.capacity}"></span></p>
</div>

<h2>Participant List</h2>

<table>
  <thead>
  <tr>
    <th>Select</th>
    <th>ID</th>
    <th>Email</th>
    <th>First Name</th>
    <th>Last Name</th>
    <th>Age</th>
    <th>Action</th>
  </tr>
  </thead>
  <tbody>
  <tr th:each="p : ${participants}">
    <td><input type="checkbox" name="participantIds" th:value="${p.id}"/></td>
    <td th:text="${p.id}"></td>
    <td th:text="${p.email}"></td>
    <td th:text="${p.firstName}"></td>
    <td th:text="${p.lastName}"></td>
    <td th:text="${p.age}"></td>
    <td class="action-buttons">
      <a th:href="@{'/participants/delete/' + ${p.id}}" class="delete"
         onclick="return confirm('Delete this participant?')">Delete</a>
    </td>
  </tr>
  </tbody>
</table>


<div class="top-buttons">
  <button type="button" class="delete-selected" onclick="deleteSelectedParticipants()">Delete selected</button>

  <form th:action="@{'/details/' + ${event.id} + '/export'}" method="get" style="display:inline;">
    <button type="submit" class="export-csv">Export to CSV</button>
  </form>
</div>

<div class="top-buttons">
  <a class="back" href="/">Back to class schedule</a>
</div>

<script>
  function deleteSelectedParticipants() {
    const selected = Array.from(document.querySelectorAll('input[name="participantIds"]:checked'))
            .map(cb => cb.value);
    if(selected.length === 0){
      alert("No participants selected!");
      return;
    }
    if(!confirm("Are you sure you want to delete the selected participants?")) return;

    const form = document.createElement('form');
    form.method = 'post';
    form.action = '/participants/delete-multiple';

    selected.forEach(id => {
      const input = document.createElement('input');
      input.type = 'hidden';
      input.name = 'ids';
      input.value = id;
      form.appendChild(input);
    });

    document.body.appendChild(form);
    form.submit();
  }
</script>

</body>
</html>
