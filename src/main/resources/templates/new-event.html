<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Add new class</title>
  <style>
    body { font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; margin: 40px; }
    form { display: flex; flex-direction: column; gap: 12px; width: 350px; }
    label { font-weight: bold; }
    input, select { padding: 8px; width: 100%; box-sizing: border-box; }
    .time-container { display: flex; gap: 10px; }
    .time-container div { flex: 1; display: flex; flex-direction: column; }
    button { margin-top: 12px; padding: 10px; background: #4CAF50; color: white; border: none; border-radius: 6px; cursor: pointer; width: 100%; }
    button:hover { background: #45a049; }
    .cancel-btn { background: #f44336; margin-top: 8px; }
    .cancel-btn:hover { background: #d32f2f; }
    .error { color: red; margin-bottom: 12px; text-align: center; white-space: pre-line; }
  </style>

</head>
<body>
<h1>Add new class</h1>

<div th:if="${error}" class="error" th:text="${error}"></div>

<form th:action="@{/new-event}" method="post">
  <label for="title">Class:</label>
  <input list="classList" id="title" name="title" th:value="${event.title}" oninput="updateDefaults()">
  <datalist id="classList">
    <option value="Pilates">
    <option value="Reformer Pilates">
    <option value="Zumba">
    <option value="Yoga">
    <option value="ABT">
    <option value="HIIT">
  </datalist>

  <label for="location">Room:</label>
  <select id="location" name="location">
    <option value="1.1">1.1</option>
    <option value="1.2">1.2</option>
    <option value="2.1">2.1</option>
    <option value="2.2">2.2</option>
  </select>

  <label for="capacity">Participant capacity:</label>
  <input type="number" id="capacity" name="capacity" th:value="${event.capacity}" required min="1">

  <label for="date">Date:</label>
  <input type="date" id="date" name="date"
         th:value="${event.startTime != null} ? ${#temporals.format(event.startTime, 'yyyy-MM-dd')} : ''" required/>

  <div class="time-container">
    <div>
      <label for="startTime">Start:</label>
      <input type="time" id="startTime" name="startTime"
             th:value="${event.startTime != null} ? ${#temporals.format(event.startTime, 'HH:mm')} : ''" required/>

    </div>
    <div>
      <label for="endTime">End:</label>
      <input type="time" id="endTime" name="endTime"
             th:value="${event.endTime != null} ? ${#temporals.format(event.endTime, 'HH:mm')} : ''" required/>
    </div>
  </div>

  <button type="submit">Add class</button>
  <button type="button" class="cancel-btn" onclick="window.location.href='/'">Cancel</button>
</form>

<script>
  const defaults = {
    "Pilates": { room: "1.1", capacity: 20 },
    "Reformer Pilates": { room: "1.2", capacity: 15 },
    "Zumba": { room: "2.1", capacity: 25 },
    "Yoga": { room: "2.2", capacity: 18 },
    "ABT": { room: "1.1", capacity: 20 },
    "HIIT": { room: "2.1", capacity: 25 }
  };

  function updateDefaults() {
    const activity = document.getElementById("title").value;
    if (defaults[activity]) {
      document.getElementById("location").value = defaults[activity].room;
      document.getElementById("capacity").value = defaults[activity].capacity;
    }
  }

  function confirmPastDate(event) {
    const dateInput = document.getElementById("date").value;
    const startTimeInput = document.getElementById("startTime").value;

    if (!dateInput || !startTimeInput) return true; // jeśli brak danych, nic nie robimy

    const selectedDateTime = new Date(dateInput + 'T' + startTimeInput);
    const now = new Date();

    if (selectedDateTime < now) {
      const proceed = confirm("The class start time is in the past. Are you sure you want to create it?");
      if (!proceed) {
        event.preventDefault();
        return false;
      }
    }
    return true;
  }

  document.addEventListener("DOMContentLoaded", () => {
    const form = document.querySelector("form");
    form.addEventListener("submit", confirmPastDate);
  });
</script>

</body>
</html>
