<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Unregister</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; margin: 40px; }
        form { display: flex; flex-direction: column; gap: 12px; width: 300px; }
        label { font-weight: bold; }
        input { padding: 8px; width: 100%; box-sizing: border-box; }
        .error { color: red; text-align: center; }
        button { background: #f44336; color: white; padding: 10px; border: none; border-radius: 6px; cursor: pointer; }
        button:hover { background: #d32f2f; }
    </style>
</head>
<body>

<h1 th:text="'Unregister from ' + ${event.title}"></h1>

<div th:if="${error}" class="error" th:text="${error}"></div>

<form th:action="@{'/unregister/' + ${event.id}}" method="post" th:object="${participant}">

    <label>Email:</label>
    <input type="email" th:field="*{email}" required />

    <label>First name:</label>
    <input type="text" th:field="*{firstName}" required />

    <label>Last name:</label>
    <input type="text" th:field="*{lastName}" required />

    <label>Age:</label>
    <input type="number" th:field="*{age}" min="1" required />

    <button type="submit" onclick="return confirm('Are you sure you want to unregister?')">Unregister</button>
</form>
</body>
</html>
